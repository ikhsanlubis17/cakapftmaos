# ==============================================================================
# Docker Compose Orchestration for CAKAP FT MAOS
# PT Pertamina Patra Niaga - Fuel Terminal Maos
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Main Application Container (Nginx + PHP 8.4-FPM + Supervisord)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: cakapftmaos-app:latest
    container_name: cakap_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "${APP_NAME:-CAKAP FT MAOS}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-cakapftmaos}"
      DB_USERNAME: "${DB_USERNAME:-cakap_user}"
      DB_PASSWORD: "${DB_PASSWORD:-cakap_secret_123}"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
      CACHE_ON_STARTUP: "${CACHE_ON_STARTUP:-true}"
    volumes:
      - app_storage:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cakap_network

  # ----------------------------------------------------------------------------
  # 2. Database Service (MySQL 8.0)
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: cakap_db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-cakapftmaos}"
      MYSQL_USER: "${DB_USERNAME:-cakap_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-cakap_secret_123}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret_pertamina}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret_pertamina}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cakap_network

  # ----------------------------------------------------------------------------
  # 3. Redis In-Memory Store (Cache, Sessions & Queue)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cakap_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - cakap_network

  # ----------------------------------------------------------------------------
  # 4. Background Queue Worker (Mailable, Critical Damage, Alert Digests)
  # ----------------------------------------------------------------------------
  queue:
    image: cakapftmaos-app:latest
    container_name: cakap_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3
    environment:
      APP_NAME: "${APP_NAME:-CAKAP FT MAOS}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-cakapftmaos}"
      DB_USERNAME: "${DB_USERNAME:-cakap_user}"
      DB_PASSWORD: "${DB_PASSWORD:-cakap_secret_123}"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTO_MIGRATE: "false"
      CACHE_ON_STARTUP: "false"
    volumes:
      - app_storage:/var/www/html/storage/app/public
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cakap_network

  # ----------------------------------------------------------------------------
  # 5. Scheduled Task Runner (Daily Overdue Checks, Shift Reminders)
  # ----------------------------------------------------------------------------
  scheduler:
    image: cakapftmaos-app:latest
    container_name: cakap_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      APP_NAME: "${APP_NAME:-CAKAP FT MAOS}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-cakapftmaos}"
      DB_USERNAME: "${DB_USERNAME:-cakap_user}"
      DB_PASSWORD: "${DB_PASSWORD:-cakap_secret_123}"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTO_MIGRATE: "false"
      CACHE_ON_STARTUP: "false"
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cakap_network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  cakap_network:
    driver: bridge
